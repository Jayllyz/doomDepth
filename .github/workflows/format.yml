name: "Clang format"

on:
  push:
    branches:
    - main
  pull_request:


env:
  CI: true
  FORCE_COLOR: 1

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}
        fetch-depth: 2

    - uses: jayllyz/clang-format-action@main
      # Default options
      with:
        check: false
        style: file
        extensions: cpp,h,hpp,c

    # commit the changes (if there are any)
    - name: Commit changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "clang-format ✅"
        branch: ${{ github.head_ref }}
...
